name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Alle fietsknooppunten van Nederland ophalen en in de app zetten. Lukt dit niet,
      # dan wordt de app toch gebouwd en haalt hij de knooppunten zelf op.
      - name: Knooppuntgegevens ophalen
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          curl -sSL --retry 3 -o nl.osm.pbf https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          osmium tags-filter nl.osm.pbf r/network=rcn n/rcn_ref -o nl.filtered.pbf --overwrite
          # Plaatsnamen (stad, dorp, gehucht) voor "Onderweg verkennen", zonder internet te gebruiken.
          osmium tags-filter nl.osm.pbf n/place=city,town,village,hamlet -o nl.places.pbf --overwrite || true
          # Ponten en veren.
          osmium tags-filter nl.osm.pbf w/route=ferry -o nl.ferries.pbf --overwrite || true
          # Cafés, restaurants en toiletten voor "Pauzeplekken".
          osmium tags-filter nl.osm.pbf nw/amenity=cafe,restaurant,toilets,fast_food,pub,ice_cream -o nl.pois.pbf --overwrite || true
          rm -f nl.osm.pbf
          FILES="nl.filtered.pbf"
          PLACES=""
          [ -f nl.places.pbf ] && PLACES="nl.places.pbf"
          FERRIES=""
          [ -f nl.ferries.pbf ] && FERRIES="nl.ferries.pbf"
          POIS=""
          [ -f nl.pois.pbf ] && POIS="nl.pois.pbf"
          # Aangrenzende gebieden: Vlaanderen/België en de Duitse grensdeelstaten. Mislukt er een, dan gaat het zonder verder.
          for gebied in europe/belgium europe/germany/nordrhein-westfalen europe/germany/niedersachsen; do
            naam=$(basename "$gebied")
            if curl -sSL --retry 3 -o "$naam.osm.pbf" "https://download.geofabrik.de/$gebied-latest.osm.pbf" \
              && osmium tags-filter "$naam.osm.pbf" r/network=rcn n/rcn_ref -o "$naam.filtered.pbf" --overwrite; then
              FILES="$FILES $naam.filtered.pbf"
              osmium tags-filter "$naam.osm.pbf" n/place=city,town,village,hamlet -o "$naam.places.pbf" --overwrite && PLACES="$PLACES $naam.places.pbf"
              osmium tags-filter "$naam.osm.pbf" w/route=ferry -o "$naam.ferries.pbf" --overwrite && FERRIES="$FERRIES $naam.ferries.pbf"
              osmium tags-filter "$naam.osm.pbf" nw/amenity=cafe,restaurant,toilets,fast_food,pub,ice_cream -o "$naam.pois.pbf" --overwrite && POIS="$POIS $naam.pois.pbf"
            else
              echo "Overgeslagen: $naam"
            fi
            rm -f "$naam.osm.pbf"
          done
          osmium merge $FILES -o gefilterd.osm --overwrite
          mkdir -p app/src/main/assets
          python3 tools/build_data.py gefilterd.osm app/src/main/assets/knooppunten.json
          if [ -n "$PLACES" ]; then
            osmium merge $PLACES -o plaatsen.osm --overwrite && python3 tools/build_places.py plaatsen.osm app/src/main/assets/plaatsen.json || echo "Plaatsnamen overgeslagen"
          fi
          if [ -n "$FERRIES" ]; then
            osmium merge $FERRIES -o ponten.osm --overwrite && python3 tools/build_ferries.py ponten.osm app/src/main/assets/ponten.json || echo "Ponten overgeslagen"
          fi
          if [ -n "$POIS" ]; then
            osmium merge $POIS -o pauze.osm --overwrite && python3 tools/build_pois.py pauze.osm app/src/main/assets/pauze.json || echo "Pauzeplekken overgeslagen"
          fi
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK bouwen
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            # Fouten als korte meldingen tonen, zodat ze ook zonder volledig log leesbaar zijn.
            grep -E "^e: |What went wrong|error:" -A2 build.log | head -30 | while IFS= read -r regel; do
              echo "::error::$regel"
            done
            exit 1
          }

      - name: APK klaarzetten als download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Knooppunt.apk
          gh release create "build-${{ github.run_number }}" Knooppunt.apk --title "Knooppunt ${{ github.run_number }}" --notes "Download Knooppunt.apk en installeer hem. Updates gaan over de vorige versie heen; je opgeslagen routes blijven staan."
