name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Alle fietsknooppunten van Nederland ophalen en in de app zetten. Lukt dit niet,
      # dan wordt de app toch gebouwd en haalt hij de knooppunten zelf op.
      - name: Knooppuntgegevens ophalen
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          curl -sSL --retry 3 -o nl.osm.pbf https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          osmium tags-filter nl.osm.pbf r/network=rcn n/rcn_ref -o gefilterd.osm --overwrite
          mkdir -p app/src/main/assets
          python3 tools/build_data.py gefilterd.osm app/src/main/assets/knooppunten.json
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK bouwen
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            # Fouten als korte meldingen tonen, zodat ze ook zonder volledig log leesbaar zijn.
            grep -E "^e: |What went wrong|error:" -A2 build.log | head -30 | while IFS= read -r regel; do
              echo "::error::$regel"
            done
            exit 1
          }

      - name: APK klaarzetten als download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Knooppunt.apk
          gh release create "build-${{ github.run_number }}" Knooppunt.apk --title "Knooppunt ${{ github.run_number }}" --notes "Download Knooppunt.apk en installeer hem. Updates gaan over de vorige versie heen; je opgeslagen routes blijven staan."
